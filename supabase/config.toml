project_id = "pbrqdlkjoxvglcdlixbi"

# All edge functions now require JWT verification for security
# Authentication is handled within each function

[functions.smart-insights]
verify_jwt = false

[functions.analyze-body]
verify_jwt = false

# Garmin CIQ direct-push endpoints — called from the watch, which has no
# Supabase user session. Auth is done inside each function:
#   redeem-garmin-pairing        — code IS the auth (hash lookup in DB)
#   push-garmin-watch-workout    — HMAC-signed watch JWT (see _shared/garmin-jwt.ts)

[functions.redeem-garmin-pairing]
verify_jwt = false

[functions.push-garmin-watch-workout]
verify_jwt = false

# Background HealthKit sync endpoint — called from the iPhone's native
# HKObserverQuery handler while the app is in a background wake, with a
# 90-day device JWT in the Authorization header. No Supabase user
# session is available in that context. Auth is done inside the function
# via _shared/healthkit-device-jwt.ts.
[functions.sync-healthkit-background]
verify_jwt = false

# Owner analytics digest — invoked by pg_cron (Authorization: Bearer <DIGEST_CRON_SECRET>)
# or manually with x-digest-secret. Auth is a shared secret checked inside the function.
[functions.analytics-digest]
verify_jwt = false
