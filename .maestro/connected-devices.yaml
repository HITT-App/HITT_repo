# Smoke test for the Connected Devices page added 2026-06-28.
#
# IMPORTANT: navigate to the Connected Devices page MANUALLY before running
# this flow (Profile → Connected Devices). The flow then validates that the
# page renders correctly and the Sync button responds.

appId: com.hiitfitness.app
---
# Attach to the currently running app — don't terminate/relaunch (which
# would wipe whatever screen you've manually navigated to).
- launchApp:
    clearState: false
    stopApp: false

# Confirm we're on the new dedicated Connected Devices page (not the
# Profile/Settings tab which also has a "Connected Devices" nav row).
# "Sources auto-detected" is unique to the dedicated page.
- assertVisible: "Connected Devices"
- extendedWaitUntil:
    visible:
      text: "Sources auto-detected|No devices syncing yet"
    timeout: 5000

# Tap the sync button (top-right refresh icon — has aria-label "Sync now").
# Both match strategies are tried because Maestro accessibility-label lookups
# vary by Capacitor version.
- tapOn:
    id: "Sync now"
    optional: true
- tapOn:
    text: "Sync now"
    optional: true
