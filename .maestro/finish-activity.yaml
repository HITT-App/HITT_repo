# Regression guard for the Finish-button-does-nothing bug fixed 2026-06-29.
#
# Bug shape: ActivityLive.handleFinish awaited 3 Supabase round-trips before
# flipping setShowCompleted(true), so any slow network made the Finish button
# look unresponsive. Now the success screen fires synchronously on tap.
#
# IMPORTANT: navigate to the ActivityLive pre-start screen MANUALLY before
# running this flow (Home → Activity tile → Walk, or your usual path). The
# flow takes over from the "Ready?" screen and validates the actual contract:
# tapping Finish flips the completion screen synchronously.

appId: com.hiitfitness.app
---
# Attach to the currently running app — don't terminate/relaunch (which
# would wipe whatever screen you've manually navigated to).
- launchApp:
    clearState: false
    stopApp: false

# Confirm we're on the ActivityLive pre-start screen.
- assertVisible: "Ready?"

# Start the activity
- tapOn: "Ready?"

# Wait for the live screen to render
- waitForAnimationToEnd

# Tap Finish. Button text is dynamic — "Finish Walk" / "Finish Run" etc.
- tapOn:
    text: "Finish.*"

# THE CONTRACT: the completion screen MUST appear within 3 seconds of tap,
# regardless of network. Before the fix this would never fire because
# setShowCompleted(true) sat behind 3 awaited Supabase calls. The
# "Share workout" header is unique to the completion screen.
- extendedWaitUntil:
    visible: "Share workout"
    timeout: 3000
- assertVisible: "DURATION"
- assertVisible: "DISTANCE"
