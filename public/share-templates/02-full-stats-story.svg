<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" fill="none">
<defs>
  <filter id="stkShadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="32" stdDeviation="44" flood-color="#000" flood-opacity="0.26"></feDropShadow>
  </filter>
</defs>
<!-- Logo -->
<rect x="64" y="64" width="152" height="152" rx="76" fill="#F4F1E8" filter="url(#stkShadow)"></rect>
<g transform="translate(96,96) scale(0.880)" fill="#FF8A26"><path d="M28,14 L40,0 L46,0 L46,42 L54,42 L54,0 L60,0 L72,14 L72,86 L60,100 L54,100 L54,58 L46,58 L46,100 L40,100 L28,86 Z"></path><path d="M4,36 L24,22 L24,78 L4,64 Z"></path><path d="M76,22 L96,36 L96,64 L76,78 Z"></path></g>
<!-- Floating title (patchable) -->
<text x="540" y="1558" text-anchor="middle" font-size="38" fill="rgba(255,255,255,0.92)" font-weight="700" letter-spacing="6" id="title_1">MY STATS THIS WEEK</text>
<!-- 4-column stat box -->
<rect x="48" y="1580" width="984" height="270" rx="56" fill="#F4F1E8" filter="url(#stkShadow)"></rect>
<!-- Col 1: WORKOUTS -->
<text x="102" y="1648" font-size="26" fill="rgba(14,14,16,0.55)" font-weight="700" letter-spacing="4" id="label_1">WORKOUTS</text>
<text x="102" y="1808" font-size="72" fill="#0E0E10" font-weight="900" letter-spacing="-2" id="stat_1">5</text>
<!-- Divider -->
<rect x="295" y="1618" width="4" height="198" rx="0" fill="rgba(14,14,16,0.55)" fill-opacity="0.35"></rect>
<!-- Col 2: MINUTES -->
<text x="322" y="1648" font-size="26" fill="rgba(14,14,16,0.55)" font-weight="700" letter-spacing="4" id="label_2">MINUTES</text>
<text x="322" y="1808" font-size="72" fill="#0E0E10" font-weight="900" letter-spacing="-2" id="stat_2">148</text>
<!-- Divider -->
<rect x="538" y="1618" width="4" height="198" rx="0" fill="rgba(14,14,16,0.55)" fill-opacity="0.35"></rect>
<!-- Col 3: KCAL -->
<text x="565" y="1648" font-size="26" fill="rgba(14,14,16,0.55)" font-weight="700" letter-spacing="4" id="label_3">KCAL</text>
<text x="565" y="1808" font-size="72" fill="#0E0E10" font-weight="900" letter-spacing="-2" id="stat_3">1,240</text>
<!-- Divider -->
<rect x="778" y="1618" width="4" height="198" rx="0" fill="rgba(14,14,16,0.55)" fill-opacity="0.35"></rect>
<!-- Col 4: STREAK -->
<text x="805" y="1648" font-size="26" fill="rgba(14,14,16,0.55)" font-weight="700" letter-spacing="4" id="label_4">STREAK</text>
<text x="805" y="1808" font-size="72" fill="#0E0E10" font-weight="900" letter-spacing="-2" id="stat_4">9</text>
</svg>
