<!doctype html>
<html lang="en" data-preview-boot="pending" data-preview-cover="visible">
  <head>
    <meta charset="UTF-8" />
    <style id="preview-boot-style">
      html[data-preview-boot="pending"],
      html[data-preview-boot="pending"] body {
        background: hsl(0 0% 4%) !important;
      }

      #preview-boot-mask {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        background: hsl(0 0% 4%);
      }

      html[data-preview-boot="pending"] #preview-boot-mask,
      html[data-preview-cover="visible"] #preview-boot-mask {
        opacity: 1 !important;
        visibility: visible !important;
      }

      html[data-preview-cover="visible"] body > *:not(#preview-boot-mask):not(script),
      html[data-preview-boot="pending"] body > *:not(#preview-boot-mask):not(script) {
        opacity: 0 !important;
        visibility: hidden !important;
      }
    </style>
    <script>
      (() => {
        try {
          const previewBusterParam = "__preview_ts";
            const previewResumeRefreshFlag = "preview-resume-refresh";
          const previewMaxAgeMs = 45_000;
          const { hostname } = window.location;
          const isEmbeddedPreview = window.self !== window.top;
          const isLovablePreviewHost =
            hostname.includes("preview--") ||
            hostname === "lovableproject.com" ||
            hostname.endsWith(".lovableproject.com") ||
            (hostname.endsWith(".lovable.app") &&
              (hostname.includes("preview--") || isEmbeddedPreview));

          if (!isLovablePreviewHost) {
            document.documentElement.removeAttribute("data-preview-boot");
            document.documentElement.removeAttribute("data-preview-cover");
            return;
          }

          document.documentElement.setAttribute("data-preview-boot", "pending");
          document.documentElement.setAttribute("data-preview-cover", "visible");

          const ensurePreviewMask = () => {
            if (document.getElementById("preview-boot-mask")) return;
            const mask = document.createElement("div");
            mask.id = "preview-boot-mask";
            mask.setAttribute("aria-hidden", "true");
            (document.body || document.documentElement).prepend(mask);
          };

          ensurePreviewMask();

          const nextUrl = new URL(window.location.href);
          const rawTimestamp = nextUrl.searchParams.get(previewBusterParam);
          const timestamp = rawTimestamp ? Number(rawTimestamp) : Number.NaN;
          const needsRefresh =
            !Number.isFinite(timestamp) || Date.now() - timestamp > previewMaxAgeMs;

          if (needsRefresh) {
            nextUrl.searchParams.set(previewBusterParam, `${Date.now()}`);
            window.location.replace(nextUrl.toString());
            return;
          }

          const freezePreview = () => {
            document.documentElement.setAttribute("data-preview-boot", "pending");
            document.documentElement.setAttribute("data-preview-cover", "visible");
            ensurePreviewMask();
            document.getElementById("root")?.replaceChildren();
          };

          const markPreviewRefresh = () => {
            sessionStorage.setItem(previewResumeRefreshFlag, "1");
          };

          document.addEventListener(
            "visibilitychange",
            () => {
              if (document.visibilityState === "hidden") {
                markPreviewRefresh();
                freezePreview();
              }
            },
            { capture: true }
          );

          window.addEventListener(
            "beforeunload",
            () => {
              freezePreview();
            },
            { capture: true }
          );

          window.addEventListener(
            "pagehide",
            () => {
              markPreviewRefresh();
              freezePreview();
            },
            { capture: true }
          );
        } catch {
          // best-effort preview guard
        }
      })();
    </script>
    <!-- Prevent stale cached HTML in preview/dev -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- App Title & SEO -->
    <title>HIIT Fitness - High Intensity Training App</title>
    <meta name="description" content="Transform your fitness with personalized HIIT workouts, AI coaching, nutrition tracking, and community support. Start your journey today!" />
    <meta name="author" content="HIIT Fitness" />
    <meta name="keywords" content="HIIT, fitness, workout, training, exercise, health, nutrition" />

    <!-- Mobile App Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HIIT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="msapplication-TileColor" content="#f97316" />

    <!-- PWA Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/app-icon-1024.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="HIIT Fitness - High Intensity Training App" />
    <meta property="og:description" content="Transform your fitness with personalized HIIT workouts, AI coaching, and nutrition tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@HIITFitness" />
    <meta name="twitter:image" content="https://lovable.dev/opengraph-image-p98pqg.png" />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Share-card fonts (Saira Condensed for values/labels, Inter for UI). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="preview-boot-mask" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
