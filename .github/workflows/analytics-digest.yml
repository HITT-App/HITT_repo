name: Analytics Digest

# Daily owner analytics email (PostHog + Sentry) sent via Spacemail SMTP.
# Runs on GitHub-hosted runners because Supabase's edge runtime firewalls
# outbound SMTP — proven 2026-07-10 (465/587 both time out from edge).
#
# The daily `schedule` is intentionally left commented until the digest body
# is built + the SMTP path is verified. Until then, run it manually:
#   Actions → Analytics Digest → Run workflow → mode = smoketest
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoketest | digest"
        default: "smoketest"
      to:
        description: "override recipient (optional; smoketest defaults to the From address)"
        default: ""
  # schedule:
  #   - cron: "0 6 * * *"   # 07:00 Europe/London during BST (06:00 UTC). See DST note in the script.

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install --no-save nodemailer@6
      - name: Run digest
        run: node .github/scripts/analytics-digest.mjs
        env:
          MODE: ${{ github.event.inputs.mode || 'digest' }}
          TO_OVERRIDE: ${{ github.event.inputs.to }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_FROM_EMAIL: ${{ secrets.DIGEST_FROM_EMAIL }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_TZ: ${{ secrets.OWNER_TZ }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_HOST: ${{ secrets.SENTRY_HOST }}
